name: crop-disease-classification

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.8

  # --- Deep learning (report: PyTorch, torchvision; NVIDIA GPU setup) ---
  # This installs a generic (CPU-capable) PyTorch build. For GPU training,
  # replace with a CUDA-enabled build matching your driver, e.g.:
  #   conda install pytorch torchvision pytorch-cuda=11.8 -c pytorch -c nvidia
  # or see https://pytorch.org/get-started/locally/ for the right combo for
  # your GPU/driver (the notebooks were run against CUDA-enabled PyTorch,
  # observed wheel builds up to cu124 during early prototyping).
  - pytorch>=2.0
  - torchvision>=0.15

  # Used in dataset_pipeline/dataset_balancing.ipynb for image augmentation
  # (tensorflow.keras.preprocessing.image.ImageDataGenerator) during dataset
  # rebalancing — not part of the report's stated model-training stack, but
  # a genuine import found by scanning the notebooks.
  - tensorflow>=2.10

  # --- Core scientific / data stack (report + import scan) ---
  - numpy>=1.21
  - pandas>=1.3
  - matplotlib>=3.5
  - scikit-learn>=1.0
  - seaborn>=0.11          # confusion-matrix heatmaps
  - pillow>=9.0             # PIL, used for image loading in inference notebooks
  - tabulate>=0.9           # per-class accuracy tables

  # --- Report-stated tooling not found via direct import scan ---
  - tqdm>=4.60
  - albumentations>=1.3

  # --- Reading/writing the metrics_*.xlsx files ---
  - openpyxl>=3.0

  # --- Notebook tooling ---
  - jupyterlab>=3.0
  - notebook>=6.4
  - nbformat>=5.0

  - pip
  - pip:
      # Not available on conda-forge; small pure-Python model-summary utility
      # used across all training notebooks (from torchsummary import summary).
      - torchsummary>=1.5
